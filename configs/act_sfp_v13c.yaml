# ACT v13c — disable CVAE entirely (pure conditional regression head)
#
# Third parallel experiment alongside v13 (image norm + aggressive weighting)
# and v13b (kl_weight: 10 -> 1 + n_action_steps: 1 -> 25).  v13c isolates ONE
# variable for clean attribution: use_vae: true -> false.
#
# Hypothesis
# ----------
# v12 deploys with |UNNORM action|_inf in [1.4, 4.3] mm/s while the path is
# correctly aimed at the port (trajectory_efficiency 6/6).  The remaining gap
# is magnitude.  v13b tests the soft form of "the CVAE prior pulls outputs
# toward zero" by reducing kl_weight 10x.  v13c tests the strict form: remove
# the CVAE entirely.
#
# Mechanism: ACT encodes the action chunk into latent z via the VAE encoder
# during training, and the decoder conditions on z ~ N(0, I) at inference.
# Under L1 + a real KL term, the decoder is regularized toward producing
# action chunks that decode well from prior-region latents -- which, on a
# dataset that's 75-98% idle, means action chunks centered near zero.
# Setting use_vae: false strips the latent path: the decoder cross-attends
# directly to observation features and outputs the action chunk
# deterministically.  No prior, no sampling noise, no KL term.
#
# Why this is orthogonal to v13 and v13b
# --------------------------------------
#   v13   attacks features (image norm) and loss balance (action_weighting).
#   v13b  attacks decoder output via softer prior (kl_weight 10 -> 1)
#         and reduces deploy-time averaging (n_action_steps 1 -> 25).
#   v13c  removes the prior entirely (use_vae: false).
# Three different mechanisms.  If multiple help, v14 stacks them.
#
# Risks and mitigations
# ---------------------
# Removing VAE forces the head to average over any multimodal demonstrations
# (e.g., "approach from the left or the right, both valid").  With 115
# unimodal SFP-port demonstrations this risk is low, but if val/l1 jumps
# significantly worse than v12's 0.260 we know the latent was doing real
# work and the answer is "some VAE, less KL" -- i.e., revert to v13b's
# kl_weight=1 with use_vae=true.
#
# v12 baseline (SFP only):
#   trial_1: 26.81  (final dist 0.09m)
#   trial_2: 15.70  (final dist 0.11m)
#   total : 42.51
#
# v13c targets:
#   - val/l1_loss within 15% of v12's 0.260 (we removed a regularizer; some
#     loss degradation is expected and acceptable if motion improves)
#   - |UNNORM action|_inf > 5 mm/s on iter 0 at deploy
#   - At least one trial with final plug-port distance below 0.05m
#
# Launch:
#   ./scripts/launch_train_act_v13c.sh
#   CUDA_DEVICE_ID=2 ./scripts/launch_train_act_v13c.sh
#
#   Manual:
#   cd /scratch2/atang/ws_aic/src/aic && CUDA_VISIBLE_DEVICES=2 \
#     pixi run python /scratch2/atang/ws_aic/scripts/train_act.py \
#     --config /scratch2/atang/ws_aic/configs/act_sfp_v13c.yaml

run_name: v13c_no_vae
seed: 42
output_dir: outputs/act_sfp
device: cuda

# ---------------------------------------------------------------------------
# Dataset (unchanged from v12)
# ---------------------------------------------------------------------------
dataset:
  root: teleop-dataset-ft-v1
  repo_id: local/teleop_sfp_ft
  video_backend: pyav
  val_num_episodes: 15

  cameras:
    - observation.images.left_camera
    - observation.images.center_camera
    - observation.images.right_camera

  state_drop_prefixes:
    - tcp_velocity.
    - tcp_error.

  stats_train_only: true
  trim_tail_fraction: 0.05

  previous_action:
    enable: false

# ---------------------------------------------------------------------------
# Training loop (unchanged from v12)
# ---------------------------------------------------------------------------
training:
  steps: 15_000
  batch_size: 32
  num_workers: 16
  prefetch_factor: 4
  pin_memory: true
  grad_clip_norm: 10.0
  use_amp: true
  amp_dtype: bfloat16

lr_schedule:
  enable: true
  warmup_steps: 500
  min_lr_ratio: 0.01

augmentation:
  enable: true
  color_jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.05
    p: 0.8
  random_erasing:
    p: 0.25
    scale: [0.02, 0.10]
    ratio: [0.3, 3.3]
    value: 0.0

# Kept at v12 settings on purpose -- v13 explores this axis.
action_weighting:
  enable: true
  scale: 0.03
  floor: 0.1
  ceil: 1.0

early_stopping:
  enable: true
  metric: val/l1_loss
  mode: minimize
  patience_steps: 3_000
  min_delta: 0.0002
  min_steps: 3_000

evaluation:
  eval_freq: 500
  eval_batches: null
  eval_batch_size: 32

logging:
  log_freq: 100
  save_freq: 2_500
  keep_last_n_checkpoints: 5

wandb:
  enable: true
  project: act_sfp
  entity: null
  tags: ["act", "sfp", "v13c", "3cam", "ft-sensor", "joint-velocities",
         "ema-smoothed", "ft-v1", "27d-state", "115ep",
         "cosine-lr", "frozen-backbone", "no-vae", "pure-regression"]

# ---------------------------------------------------------------------------
# ACT policy hyperparameters
# ---------------------------------------------------------------------------
policy:
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 1

  vision_backbone: resnet18
  pretrained_backbone_weights: "ResNet18_Weights.IMAGENET1K_V1"
  replace_final_stride_with_dilation: false

  pre_norm: false
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  feedforward_activation: relu
  n_encoder_layers: 2
  n_decoder_layers: 1

  # v13c CHANGE: disable the CVAE entirely.  The latent_dim, n_vae_encoder_layers,
  # and kl_weight fields below are unused in this configuration -- left in
  # place so a quick toggle back to use_vae: true is a one-line change.
  use_vae: false
  latent_dim: 32
  n_vae_encoder_layers: 4
  kl_weight: 10.0

  dropout: 0.1

  optimizer_lr: 1.0e-5
  optimizer_lr_backbone: 0.0
  optimizer_weight_decay: 5.0e-4

  temporal_ensemble_coeff: 0.01

  push_to_hub: false
  repo_id: null

  discrete_action:
    enable: false

  normalization_mapping:
    VISUAL: MEAN_STD
    STATE: MEAN_STD
    ENV: MEAN_STD
    ACTION: MEAN_STD
